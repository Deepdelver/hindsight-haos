name: regression-tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  regression:
    name: regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source config defaults
        run: python3 hindsight/tests/test_source_defaults.py
      - name: Ingress rewrite tests
        run: python3 hindsight/tests/test_ingress_rewrite.py
      - name: Pre-push gate tests
        run: python3 hindsight/tests/test_prepush_pipeline.py
      - name: Version watch tests
        run: python3 hindsight/tests/test_version_watch.py
      - name: Cont-init provider mapping tests
        run: python3 hindsight/tests/test_continit_providers.py
