arch:
  - aarch64
  - amd64
backup: cold
description: 'Hindsight AI Memory by Deepdelver — persistent agent memory (retain, recall, reflect) shared via MCP. Official project: https://hindsight.vectorize.io'
environment:
  HINDSIGHT_API_HOST: 0.0.0.0
  HINDSIGHT_API_PORT: "8888"
  HINDSIGHT_API_LOG_LEVEL: info
init: false
ingress: true
ingress_entry: dashboard
ingress_port: 9997
map:
  - type: app_config
    read_only: false
  - type: share
    read_only: false
name: Hindsight
options:
  env_vars: []
  mode: simple
  llm_provider: llamacpp
  llm_api_key: ""
  llm_model: gemma-4-e2b-it
  llm_base_url: ""
  # Optional dedicated consolidation route (expert mode only). Empty means
  # "reuse the normal LLM settings"; no credential belongs in these defaults.
  consolidation_llm_provider: ""
  consolidation_llm_model: ""
  consolidation_llm_base_url: ""
  consolidation_llm_api_key: ""
  consolidation_max_completion_tokens: 8192
  embeddings_provider: onnx
  embeddings_model: auto
  reranker_provider: onnx
  reranker_model: auto
  mcp_enabled: true
  worker_id: hindsight-haos
  log_level: info
  control_plane: true
  control_plane_port: 9999
panel_admin: false
panel_icon: mdi:brain
panel_title: Hindsight
ports:
  8888/tcp: 8888
  9999/tcp: 9999
ports_description:
  8888/tcp: Hindsight API and MCP server
  9999/tcp: Hindsight control plane web UI
schema:
  env_vars:
    - name: match(^[A-Za-z0-9_]+$)
      value: str?
  mode: list(simple|expert)
  # 'custom' stays for existing installs; cont-init maps it to 'openai' and
  # requires llm_base_url (the Hindsight API itself rejects 'custom').
  llm_provider: list(llamacpp|openai|ollama|anthropic|gemini|groq|deepseek|openrouter|fireworks|nous|lmstudio|custom)
  llm_api_key: password
  llm_model: str
  llm_base_url: str
  # Same types as the main LLM options: non-optional because a "" default is
  # declared above (an optional `str?` with a default is invalid in HA).
  consolidation_llm_provider: str
  consolidation_llm_model: str
  consolidation_llm_base_url: str
  consolidation_llm_api_key: password
  consolidation_max_completion_tokens: int?
  embeddings_provider: list(onnx|local|openai|cohere|tei|hindsight|litellm|litellm-sdk|openrouter|requesty|google)
  embeddings_model: str
  embeddings_api_key: password?
  reranker_provider: list(onnx|flashrank|local|hindsight|rrf|cohere|tei|openrouter|nvidia|google)
  reranker_model: str
  llamacpp_model_path: str?
  llamacpp_context_size: int?
  llamacpp_gpu_layers: int?
  mcp_enabled: bool
  mcp_auth_token: password?
  worker_id: str
  log_level: list(debug|info|warning|error)
  control_plane: bool
  control_plane_port: port
slug: hindsight
startup: services
udev: true
url: https://github.com/Deepdelver/hindsight-haos
version: "1.2.28"
watchdog: "http://[HOST]:[PORT:8888]/health"
webui: "http://[HOST]:[PORT:9999]"
