name: "Hindsight"
version: "1.0.2"
slug: "hindsight"
description: "Hindsight AI Memory — persistent agent memory with retain, recall, and reflect APIs. Shared across all your AI agents via MCP."
url: "https://github.com/Deepdelver/hindsight-haos"
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
timeout: 75

ports:
  8888/tcp: 8888
  9999/tcp: 9999
ports_description:
  8888/tcp: "Hindsight API and MCP Server"
  9999/tcp: "Hindsight Control Plane Web UI"

ingress: false
webui: "http://[HOST]:[PORT:9999/tcp]"

tmpfs: true
backup: cold

map:
  - type: share
    read_only: false

options:
  llm_provider: "openai"
  llm_api_key: ""
  llm_model: "gpt-4o-mini"
  embeddings_provider: "local"
  reranker_provider: "local"
  mcp_enabled: true
  mcp_local_bank_id: "default"
  worker_id: "hindsight-haos"
  log_level: "info"

schema:
  llm_provider: "list(openai|anthropic|gemini|groq|deepseek|ollama|fireworks|openrouter|nous|custom)"
  llm_api_key: str
  llm_model: str
  llm_base_url: "str?"
  embeddings_provider: "list(local|openai|ollama|cohere)"
  embeddings_openai_api_key: "str?"
  embeddings_openai_model: "str?"
  reranker_provider: "list(local|cohere|flashrank|rrf)"
  mcp_enabled: bool
  mcp_local_bank_id: str
  mcp_auth_token: "str?"
  worker_id: str
  log_level: "list(debug|info|warning|error)"

environment:
  HINDSIGHT_API_HOST: "0.0.0.0"
  HINDSIGHT_API_PORT: "8888"
  HINDSIGHT_API_CONTROL_PLANE_PORT: "9999"
