name: "Hindsight"
version: "1.0.0"
slug: "hindsight"
description: "Hindsight AI Memory — persistent agent memory with retain, recall, and reflect APIs. Shared across all your AI agents via MCP."
url: "https://github.com/Deepdelver/hindsight-haos"
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
timeout: 75

ports:
  8888/tcp: 8888
  9999/tcp: 9999
ports_description:
  8888/tcp: "Hindsight API & MCP Server"
  9999/tcp: "Hindsight Control Plane (Web UI)"

ingress: false
webui: "http://[HOST]:[PORT:9999/tcp]"
watchdog: "http://[HOST]:[PORT:8888/tcp]/health"

tmpfs: true
backup: cold

map:
  - type: share
    read_only: false

options:
  llm_provider: "openai"
  llm_api_key: ""
  llm_model: "gpt-4o-mini"
  worker_id: "hindsight-haos"

schema:
  llm_provider: "list(openai|groq|anthropic|ollama|custom)"
  llm_api_key: "str"
  llm_model: "str"
  worker_id: "str"

environment:
  HINDSIGHT_API_HOST: "0.0.0.0"
  HINDSIGHT_API_PORT: "8888"
  HINDSIGHT_API_CONTROL_PLANE_PORT: "9999"
