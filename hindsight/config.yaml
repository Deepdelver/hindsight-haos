arch:
  - aarch64
  - amd64
backup: cold
description: Hindsight AI Memory — persistent agent memory with retain, recall and reflect. Shared across all your AI agents via MCP.
environment:
  HINDSIGHT_API_HOST: 0.0.0.0
  HINDSIGHT_API_PORT: "8888"
  HINDSIGHT_API_CONTROL_PLANE_PORT: "9999"
  HINDSIGHT_API_DATA_DIR: /data/hindsight
  HINDSIGHT_API_LOG_LEVEL: info
image: ghcr.io/deepdelver/hindsight-{arch}
init: false
ingress: false
map:
  - type: app_config
    read_only: false
  - type: share
    read_only: false
name: Hindsight
options:
  env_vars: []
  llm_provider: openai
  llm_api_key: ""
  llm_model: gpt-4o-mini
  embeddings_provider: openai
  embeddings_model: text-embedding-3-small
  reranker_provider: rrf
  mcp_enabled: true
  mcp_local_bank_id: default
  worker_id: hindsight-haos
  log_level: info
panel_admin: false
panel_icon: mdi:brain
ports:
  8888/tcp: 8888
  9999/tcp: 9999
ports_description:
  8888/tcp: Hindsight API and MCP server
  9999/tcp: Hindsight control plane web UI
schema:
  env_vars:
    - name: match(^[A-Za-z0-9_]+$)
      value: str?
  llm_provider: list(openai|anthropic|gemini|groq|deepseek|ollama|fireworks|openrouter|nous|custom)
  llm_api_key: password
  llm_model: str
  llm_base_url: str?
  embeddings_provider: list(openai|ollama|cohere)
  embeddings_api_key: password?
  embeddings_model: str
  reranker_provider: list(rrf|cohere|flashrank)
  mcp_enabled: bool
  mcp_local_bank_id: str
  mcp_auth_token: password?
  worker_id: str
  log_level: list(debug|info|warning|error)
slug: hindsight
startup: services
udev: true
url: https://github.com/Deepdelver/hindsight-haos
version: "1.0.5"
webui: "http://[HOST]:[PORT:9999]"
